hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_trainer
  - user
  - _self_

# 2048 prompt + 8192 response, with no SDPO reprompt buffer.
max_model_len: 10240

data:
  train_batch_size: 32
  gen_batch_size: 64

actor_rollout_ref:
  actor:
    ppo_mini_batch_size: 32
    clip_ratio: 0.2
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    loss_agg_mode: token-mean
    use_kl_loss: false
    kl_loss_coef: 0.0
    optim:
      lr: 1e-6
      weight_decay: 0.1
  rollout:
    n: 8
    calculate_log_probs: true
    temperature: 1.0
    top_p: 1.0
    top_k: -1

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false
  kl_ctrl:
    kl_coef: 0.0
  filter_groups:
    _target_: verl.trainer.config.FilterGroupsConfig
    enable: true
    metric: acc
    max_num_gen_batches: 10

reward_manager:
  name: sdpo_dapo

reward_model:
  reward_manager: sdpo_dapo
  reward_kwargs:
    overlong_buffer_cfg:
      enable: true
      len: 1024
      penalty_factor: 1.0
      log: false
    max_resp_len: ${data.max_response_length}

trainer:
  project_name: DAPO
  group_name: DAPO
  val_before_train: false
  # Small datasets may need many dataloader passes after group filtering.
  total_epochs: 3000
