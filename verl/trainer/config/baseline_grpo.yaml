defaults:
  - ppo_trainer
  - user
  - _self_

# MAX_PROMPT_LENGTH=2048 + MAX_RESPONSE_LENGTH=8192 (no SDPO reprompt buffer needed)
max_model_len: 10240

actor_rollout_ref:
  actor:
    # Match SDPO tooluse runs for fair comparison (sdpo.yaml uses 32)
    ppo_mini_batch_size: 32
    # Standard verl / DeepSeekMath GRPO: symmetric clip + KL loss on policy
    clip_ratio: 0.2
    clip_ratio_low: 0.2
    clip_ratio_high: 0.2
    use_kl_loss: True
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    optim:
      lr: 1e-5
  rollout:
    n: 8
    calculate_log_probs: True

algorithm:
  adv_estimator: grpo
  # Original GRPO: normalize group advantages by std (not Dr.GRPO)
  norm_adv_by_std_in_grpo: True
  # Kept for parity with SDPO runs in this repo (train/inference mismatch correction)
  rollout_correction:
    rollout_is: token
    rollout_is_threshold: 2.0

data:
  train_batch_size: 32

trainer:
  val_before_train: False
